name: 定期提交代码

on:
  # 每周一 UTC 09:00（北京时间周一 17:00）自动提交
  schedule:
    - cron: '0 9 * * 1'

  # 手动触发
  workflow_dispatch:

# 自动提交需要写权限（默认 GITHUB_TOKEN 在部分仓库为只读）
permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 全量历史，保证推送前可 rebase 远程新提交
          fetch-depth: 0

      - name: 检查并提交变更
        id: check_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # git status --porcelain 同时覆盖未跟踪/已修改/已暂存/已删除，
          # 且遵守 .gitignore（papers/、logs/ 等不会被误提交）
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有需要提交的变更"
            echo "has_changes=False" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "变更内容:"
          git status --porcelain

          git add -A
          TODAY=$(date -u '+%Y-%m-%d')
          {
            echo "docs(global): 自动提交于 $TODAY"
            echo
            echo "变更文件:"
            git diff --cached --name-only | sed 's/^/- /'
          } > commit_msg.txt
          git commit -F commit_msg.txt
          rm -f commit_msg.txt
          echo "has_changes=True" >> "$GITHUB_OUTPUT"

      - name: 推送到远程仓库
        if: steps.check_changes.outputs.has_changes == 'True'
        run: |
          # 远程若有新提交先变基到其上，避免非快进推送被拒
          git pull --rebase origin main
          git push
          echo "成功推送到远程仓库"
